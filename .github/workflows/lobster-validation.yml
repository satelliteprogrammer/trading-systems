name: LOBSTER Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Release-gcc-16
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      CC: gcc-16
      CXX: g++-16

    steps:
    - uses: actions/checkout@v6

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build/Release" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-16 g++-16
        pipx install "conan>=2,<3"

    # The "lobster-" prefix keeps this cache (whose CMakeCache.txt has
    # LOBSTER_VALIDATION=ON) from ever being restored by build-and-test.yml,
    # while still seeding from that workflow's gcc Release cache when empty.
    - uses: actions/cache@v5
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}
        key: lobster-${{ runner.os }}-gcc-16-Release-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          lobster-${{ runner.os }}-gcc-16-Release-
          ${{ runner.os }}-gcc-16-Release-

    # LOBSTER datasets live in Git LFS; pull only AAPL and MSFT (SPY is too
    # large for CI) and cache the objects to spare LFS bandwidth.
    - name: Cache LOBSTER datasets
      uses: actions/cache@v5
      with:
        path: .git/lfs
        key: lfs-lobster-${{ hashFiles('data/lobster/AAPL_*.csv', 'data/lobster/MSFT_*.csv') }}

    - name: Fetch LOBSTER datasets
      run: git lfs pull --include="data/lobster/AAPL_*,data/lobster/MSFT_*"

    - name: Cache Conan packages
      uses: actions/cache@v5
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-gcc-16-Release-${{ hashFiles('conanfile.txt', 'conan/profiles/cpp26') }}

    - name: Install Conan dependencies
      run: |
        conan profile detect --force
        conan install . -pr:a conan/profiles/cpp26 --build=missing -s build_type=Release

    - name: Configure CMake
      run: >
        cmake --preset conan-release
        -DLOBSTER_VALIDATION=ON

    - name: Build
      run: cmake --build --preset conan-release --target lobster_validate

    - name: Validate book against LOBSTER data
      run: ctest --preset conan-release -L lobster -j 2 --output-on-failure
