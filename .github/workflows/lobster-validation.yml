name: LOBSTER Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Release-gcc-16
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v6

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y ninja-build catch2 gcc-16 g++-16

    # The "lobster-" prefix keeps this cache (whose CMakeCache.txt has
    # LOBSTER_VALIDATION=ON) from ever being restored by build-and-test.yml,
    # while still seeding from that workflow's gcc Release cache when empty.
    - uses: actions/cache@v5
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}
        key: lobster-${{ runner.os }}-gcc-16-Release-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          lobster-${{ runner.os }}-gcc-16-Release-
          ${{ runner.os }}-gcc-16-Release-

    # LOBSTER datasets live in Git LFS; pull only AAPL and MSFT (SPY is too
    # large for CI) and cache the objects to spare LFS bandwidth.
    - name: Cache LOBSTER datasets
      uses: actions/cache@v5
      with:
        path: .git/lfs
        key: lfs-lobster-${{ hashFiles('data/lobster/AAPL_*.csv', 'data/lobster/MSFT_*.csv') }}

    - name: Fetch LOBSTER datasets
      run: git lfs pull --include="data/lobster/AAPL_*,data/lobster/MSFT_*"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_C_COMPILER=gcc-16
        -DCMAKE_CXX_COMPILER=g++-16
        -DCMAKE_BUILD_TYPE=Release
        -DLOBSTER_VALIDATION=ON
        -S ${{ github.workspace }}

    - name: Build
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config Release --target lobster_validate

    - name: Validate book against LOBSTER data
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest -L lobster -j 2 --output-on-failure
