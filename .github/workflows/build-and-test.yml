name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.build_type }}-${{ matrix.compiler.c }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler:
          - c: gcc-16
            cpp: g++-16
            packages: gcc-16 g++-16
          - c: clang-23
            cpp: clang++-23
            packages: clang-23 clang-tools-23 g++-16

    env:
      CC: ${{ matrix.compiler.c }}
      CXX: ${{ matrix.compiler.cpp }}

    steps:
    - uses: actions/checkout@v6

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        build_type=${{ matrix.build_type }}
        echo "build-output-dir=${{ github.workspace }}/build/$build_type" >> "$GITHUB_OUTPUT"
        echo "preset=conan-${build_type,,}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y ninja-build ${{ matrix.compiler.packages }}
        pipx install "conan>=2,<3"

    - uses: actions/cache@v5
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}
        key: ${{ runner.os }}-${{ matrix.compiler.c }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler.c }}-${{ matrix.build_type }}-

    - name: Cache Conan packages
      uses: actions/cache@v5
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ matrix.compiler.c }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.txt', 'conan/profiles/cpp26') }}

    - name: Install Conan dependencies
      run: |
        conan profile detect --force
        conan install . -pr:a conan/profiles/cpp26 --build=missing -s build_type=${{ matrix.build_type }}

    - name: Configure CMake
      run: cmake --preset ${{ steps.strings.outputs.preset }}

    - name: Build
      run: cmake --build --preset ${{ steps.strings.outputs.preset }}

    - name: Test
      run: ctest --preset ${{ steps.strings.outputs.preset }}
